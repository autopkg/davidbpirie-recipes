Description: |
  Downloads the latest version of Yamaha R Remote as a zipped dmg.

Identifier: com.github.davidbpirie.download.YamahaRRemote
MinimumVersion: 2.3.0

Input:
  NAME: YamahaRRemote
  BASE_URL: https://au.yamaha.com
  SEARCH_RE_DOWNLOAD_ID: data-downloadid="(.*?)"
  SEARCH_RE_FILENAME: '.*?>.*?<span.*?>(.*?)\s.*?</span>'
  SEARCH_URL_SUFFIX: /en/support/updates/r_remote_mac.html
  DOWNLOAD_URL_SUFFIX: /en/download/files/


Process:
  - Processor: URLTextSearcher
    Arguments:
      re_pattern: '%SEARCH_RE_DOWNLOAD_ID%'
      url: '%BASE_URL%%SEARCH_URL_SUFFIX%'
      result_output_var_name: download_id

  - Processor: URLTextSearcher
    Arguments:
      re_pattern: '"%download_id%"%SEARCH_RE_FILENAME%'
      url: '%BASE_URL%%SEARCH_URL_SUFFIX%'
      re_flags:
        - DOTALL
      result_output_var_name: filename

  - Processor: URLDownloader
    Arguments:
      url: '%BASE_URL%%DOWNLOAD_URL_SUFFIX%%download_id%'
      filename: '%filename%'

  - Processor: EndOfCheckPhase
