Description: |
  Downloads from the Epson download center, verifies the signature
  and extracts the version.

  Set the Input values for device_id, os_code, language_code,
  region_code, category_name, and download_type_name in your override
  to match your required download. See EpsonURLProvider.py for details.

  Set PAYLOAD_VERSION_PKG to the name of the payload pkg
  that should be used for versioning.

Identifier: com.github.davidbpirie.pkg.EpsonPrinterDriver
ParentRecipe: com.github.davidbpirie.download.EpsonPrinterDriver
MinimumVersion: 2.3.0

Input:
  NAME: EpsonPrinterDriver
  device_id: Put_device_id_into_AutoPkg_recipe_override
  category_name: Drivers
  download_type_name: Printer Driver
  PAYLOAD_VERSION_PKG: Put_pkg_name_into_AutoPkg_recipe_override

Process:
  - Processor: StopProcessingIf
    Arguments:
      predicate: PAYLOAD_VERSION_PKG == 'Put_pkg_name_into_AutoPkg_recipe_override'

  - Processor: CodeSignatureVerifier
    Arguments:
      input_path: '%pathname%/*.pkg'
      expected_authority_names:
        - 'Developer ID Installer: Seiko Epson Corporation (TXAEAV5RN4)'
        - 'Developer ID Certification Authority'
        - 'Apple Root CA'

  - Processor: PkgCopier
    Arguments:
      source_pkg: '%pathname%/*.pkg'
      pkg_path: '%RECIPE_CACHE_DIR%/%NAME%.pkg'

  - Processor: FlatPkgUnpacker
    Arguments:
      flat_pkg_path: '%pkg_path%'
      destination_path: '%RECIPE_CACHE_DIR%/unpack'

  - Processor: com.github.nmcspadden.shared/PackageInfoVersioner
    Arguments:
      package_info_path: '%RECIPE_CACHE_DIR%/unpack/%PAYLOAD_VERSION_PKG%/PackageInfo'

  - Processor: PathDeleter
    Arguments:
      path_list:
        - '%RECIPE_CACHE_DIR%/unpack'
